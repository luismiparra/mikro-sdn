name: Tests

# Runs the unit and functional test suite. It never contacts a router, InfluxDB or NetBox:
# every external system is replaced by an in-memory double (see docs/testing.md).
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 📦 Install dependencies
        run: pip install -r requirements-dev.txt
      - name: 🧪 Run unit and functional tests
        run: python -m pytest
