/routing/bfd/configuration:
- use_set: "false"
  comment: 'bfd_wan_links'
  disabled: "false"
  multiplier: "25"
  interfaces: "list_wireguard_main"
- use_set: "false"
  comment: 'bfd_default'
  disabled: "false"
  multiplier: "25"


