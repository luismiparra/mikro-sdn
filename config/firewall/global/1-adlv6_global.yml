  - '2001:db8:10:0:10:21::/96'
  - '2001:db8:10:0:10:22::/96'
  - '2001:db8:10:0:10:23::/96'
  - '2001:db8:10:0:10:24::/96'
  - '2001:db8:10:0:10:25::/96'
  - '2001:db8:10:0:10:26::/96'
  - '2001:db8:10:8000::/49'     #SLAAC blocks of every site

