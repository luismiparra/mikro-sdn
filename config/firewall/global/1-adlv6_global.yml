/ipv6/firewall/address-list:

# -------------------------------------------------------------------------------------------------
# IPv6 address lists of the LAB network (example values, documentation prefix 2001:db8::/32).
# Site N routed block 2001:db8:10:0:10:2N::/96, vlan V -> 2001:db8:10:0:10:2N:V:0/112
# -------------------------------------------------------------------------------------------------

- comment: "ACL6_NETS_NOLOG"
  address:
  - '::1/128'
  - 'ff02::1/128'
  - 'ff02::1:2/128'
  - 'ff00::/8'

#Destinations blocked over IPv6 (example: a service that misbehaves over IPv6)
- comment: "ACL6_NETS_BLOCKED"
  address:
  - '2001:db8:ffff:1::/64'

#WireGuard endpoints reachable from the internet over IPv6
- comment: "ACL6_HOSTS_WG_ENDPOINTS"
  address:
  - '2001:db8:10:0:10:21:fa:2/128'

- comment: "ACL6_NETS_SITES"
