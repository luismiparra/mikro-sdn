/ip/firewall/filter:
- comment: "v4_input_log_banned"
  order: posi
  posi: '1'
  chain: input
  src_address_list: ACL4_NETS_PRIVATE
  dst_address_list: ACL4_BANNED
  log: 'true'
  log_prefix: 'FW=ban_log T=to_banned S=PRIV'
  disabled: 'false'
  action: 'log'

- comment: "v4_forward_log_banned"
  order: posi
  posi: '2'
  chain: forward
  src_address_list: ACL4_NETS_PRIVATE
  dst_address_list: ACL4_BANNED
  log: 'true'
  log_prefix: 'FW=ban_log T=to_banned S=PRIV'
  disabled: 'false'
  action: 'log'

- comment: "v4_input_drop_banned"
  order: posi
  posi: '3'
  chain: input
  src_address_list: ACL4_BANNED
  log: 'true'
  log_prefix: 'FW=ban_drop S=PUB'
  disabled: 'false'
  action: 'drop'

- comment: "v4_forward_drop_banned"
  order: posi
  posi: '4'
  chain: forward
  src_address_list: ACL4_BANNED
  log: 'true'
  log_prefix: 'FW=ban_drop S=PUB'
  disabled: 'false'
  action: 'drop'

