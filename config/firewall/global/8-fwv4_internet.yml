/ip/firewall/filter:
- comment: "v4_forward_accept_not_private"
  order: top
  chain: forward
  src_address_list: ACL4_NETS_PRIVATE
  dst_address_list: '!ACL4_NETS_PRIVATE'
  log: 'false'
  log_prefix: 'no'
  disabled: 'false'
  action: 'accept'


/ip/firewall/mangle:

- comment: "v4_mangle_forward_changemss_tcp"
  order: top
  chain: forward
  protocol: tcp
  passthrough: 'true'
  action: 'change-mss'
  tcp_flags: "syn"
  new_mss: "clamp-to-pmtu"
