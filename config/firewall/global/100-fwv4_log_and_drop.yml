/ip/firewall/filter:

#-------------------------------------icmp

- comment: "v4_input_reject_icmp_private"
  order: bot
  chain: input
  src_address_list: ACL4_NETS_PRIVATE
  protocol: icmp
  log: 'true'
  log_prefix: 'FW=in_reject T=icmp S=PRIV'
  disabled: 'false'
  action: 'reject'
  reject_with: 'icmp-admin-prohibited'

- comment: "v4_forward_reject_icmp_private"
  order: bot
  chain: forward
  src_address_list: ACL4_NETS_PRIVATE
  protocol: icmp
  log: 'true'
  log_prefix: 'FW=fw_reject T=icmp S=PRIV'
  disabled: 'false'
  action: 'reject'
  reject_with: 'icmp-admin-prohibited'

- comment: "v4_input_drop_icmp"
  order: bot
  chain: input
  protocol: icmp
  log: 'true'
  log_prefix: 'FW=in_reject T=icmp S=PUB'
  disabled: 'false'
  action: 'drop'

- comment: "v4_forward_drop_icmp"
  order: bot
  chain: forward
  protocol: icmp
  log: 'true'
  log_prefix: 'FW=fw_reject T=icmp S=PUB'
  disabled: 'false'
  action: 'drop' 

