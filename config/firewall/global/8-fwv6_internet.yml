/ipv6/firewall/filter:
- comment: "v6_forward_accept_not_private"
  order: posi
  posi: '5'
  chain: forward
  src_address_list: ACL6_NETS_PRIVATE
  dst_address_list: '!ACL6_NETS_PRIVATE'
  log: 'false'
  log_prefix: 'no'
  disabled: 'false'
  action: 'accept'


- comment: "v6_forward_reject_blocked"
  order: posi
  posi: '4'
  chain: forward
  src_address_list: ACL6_NETS_PRIVATE
  dst_address_list: ACL6_NETS_BLOCKED
  log: 'false'
  log_prefix: 'no'
  disabled: 'false'
  action: 'reject'


/ipv6/firewall/mangle:

- comment: "v6_mangle_forward_changemss_tcp"
  order: top
  chain: forward
  protocol: tcp
  passthrough: 'true'
  action: 'change-mss'
  tcp_flags: "syn"
  new_mss: "clamp-to-pmtu"